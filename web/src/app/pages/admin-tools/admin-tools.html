<div class="page">
  <h1>Admin</h1>

  @if (roomCode(); as code) {
    <div class="row">
      <span class="label">Rumskod</span>
      <span class="code">{{ code }}</span>
    </div>
  }

  @if (editorCode(); as code) {
    <div class="row">
      <span class="label">Redaktörskod</span>
      <span class="code">{{ code }}</span>
      <button type="button" class="new-code" (click)="newEditorCode()">Ny kod</button>
    </div>
  }

  <app-who-admin />
  <app-order-admin />
  <app-games-admin />
  <app-photo-admin />
  <app-missions-admin />
  <app-quiz-admin />

  <!-- Bara admin ser den här fliken. Rumslistan kräver dessutom ett admin-konto. -->
  <a class="switch-room" routerLink="/admin">Byt rum →</a>
</div>
