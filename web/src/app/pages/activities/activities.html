<div class="page">
  <h1>Aktiviteter</h1>

  <ol>
    @for (item of items(); track item.key; let i = $index) {
      <li>
        <a [routerLink]="item.path" [class]="item.status">
          <span class="num">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <span class="title">{{ item.title }}</span>
          <span class="status">{{ statusLabels[item.status] }}</span>
        </a>
      </li>
    }
  </ol>
</div>
