<form class="page" (ngSubmit)="submit()">
  <h1>Välkommen</h1>
  <p class="lead">Skriv in koden du fått.</p>

  <label for="code">Rumskod</label>
  <input
    id="code"
    name="code"
    autocomplete="off"
    autocapitalize="characters"
    placeholder="ABC123"
    [(ngModel)]="code"
  />
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <div class="bottom">
    <button type="submit" [disabled]="busy() || code().trim().length === 0">Fortsätt</button>
    <a class="admin" routerLink="/admin">Admin →</a>
  </div>
</form>
