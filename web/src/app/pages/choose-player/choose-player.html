<div class="page">
  <h1>Vem är du?</h1>
  <p class="lead">Välj ditt namn eller skapa en ny spelare.</p>

  @if (!loading()) {
    <ul>
      @for (player of players(); track player.id) {
        <li>
          <a class="row" [routerLink]="['spelare', player.id]">
            <span>{{ player.username }}</span>
            <span class="arrow">→</span>
          </a>
        </li>
      }
      <li><a class="row new" routerLink="ny">+ Jag är ny</a></li>
    </ul>
  }
</div>
